name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # the Umami tag lives in a secret, not in this public repo; a missing secret
      # ships the page untracked instead of failing the deploy
      - name: Add the analytics beacon
        env:
          ANALYTICS_TAG: ${{ secrets.ANALYTICS_TAG }}
        run: node .github/scripts/inject-analytics.mjs

      - uses: actions/configure-pages@v5
        with:
          # the first run creates the Pages site itself, so enabling Pages is not a
          # manual step before the first deploy
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

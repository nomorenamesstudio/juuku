name: image

# One build per architecture on its own runner, then the two digests are merged into
# one multi-arch tag. Emulating arm64 under qemu took hours per release and hit the
# six-hour job limit: v0.8.14 and v0.8.15 were cancelled that way, so `latest` stayed
# on 0.8.13 while the repo moved on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.9.2'
        type: string
        required: false
  # the release workflow bumps, tags and then calls this, so a release is one run
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.9.1 (defaults to the ref that triggered it)'
        type: string
        required: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # by digest: the merge job decides which tags point at what
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Keep the digest for the merge job
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Merge the per-architecture digests into the release tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      # A private package builds green and fails every `docker pull` — that is how
      # 0.8.13 shipped unpullable. Nothing in the workflow can change that (only the
      # package owner can), so this says so loudly instead of staying quiet.
      - name: Check the image is publicly pullable
        run: |
          token=$(curl -s "https://ghcr.io/token?scope=repository:${{ github.repository }}:pull&service=ghcr.io" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H "Authorization: Bearer ${token}" \
            "https://ghcr.io/v2/${{ github.repository }}/manifests/latest")
          if [ "$code" != "200" ]; then
            echo "::warning title=Image is not public::ghcr.io/${{ github.repository }}:latest answered ${code} to an anonymous pull. Package settings -> Change visibility -> Public."
          fi

  # The Releases page drifted once already: tags were pushed for months without a
  # release object, so it still read 0.8.2 while the image was on 0.8.16. This makes a
  # release part of building one, with the notes taken from that version's changelog.
  release:
    needs: merge
    if: startsWith(inputs.tag || '', 'v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Publish the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG_REF#v}"
          python3 - "$version" > /tmp/notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open('docs/CHANGELOG.md').read()
          found = re.search(rf'^## v{re.escape(version)}\b(.*?)(?=^## v|\Z)', text, re.S | re.M)
          print(found.group(1).strip() if found else f'Release {version}.')
          PY
          # the release page is what the in-app banner links to, so it carries the
          # changelog and, below it, how to actually take the update
          cat >> /tmp/notes.md <<'MD'

          ---

          **Updating:** `docker compose pull && docker compose up -d`. Pinned to a tag
          instead? Bump the tag and rebuild. The [setup guide](https://github.com/nomorenamesstudio/juuku/blob/main/docs/SETUP.md#updating)
          has the details.
          MD
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release edit "v$version" --notes-file /tmp/notes.md
          else
            gh release create "v$version" --title "$version" --notes-file /tmp/notes.md --verify-tag
          fi

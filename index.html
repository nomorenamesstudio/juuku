<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Juuku" />
    <title>Juuku — Navidrome remote</title>
    <meta name="description" content="Queue, skip and favorite music on the Navidrome jukebox that is playing in the room." />

  <body>
    <!-- iOS standalone samples the screen edge for a full-width fixed surface and
         blurs the content instead when it finds none. This is that surface: empty,
         clipped, non-interactive, and outside the app root so it exists on cold
         start. See the rule in src/styles.css. -->
    <div class="status-bar-surface" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

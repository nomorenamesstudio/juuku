# Juuku, deployed. Copy this file and .env.example next to it, fill in .env, run
# `docker compose up -d`. The rootfs stays read-only; the writable paths are the two
# directories next to this file, both owned by uid 1000.
#
# No root anywhere: this container runs as uid 1000, the same uid Navidrome's mpv
# runs as, so the 0600 IPC sockets mpv leaves behind can be opened — and quit — with
# plain file ownership instead of privileges. See docs/SETUP.md.
services:
  juuku:
    image: ghcr.io/nomorenamesstudio/juuku:latest
    # building on the box instead? comment the image line and uncomment:
    # build:
    #   context: ..
    container_name: juuku
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3101
      # preferences (lyrics settings, recent searches, sort, last played) live here
      JUUKU_DATA_DIR: /data
      # Navidrome's mpv sockets, so Settings can quit a player Navidrome lost track
      # of. Needs Navidrome started with TMPDIR pointing at the same directory, and
      # with the same uid this container runs as (1000), which every image does by
      # default. Without the mount Settings shows "Players: not shared".
      JUUKU_MPV_SOCKETS: /mpv-sockets
    ports:
      # LAN only on purpose: the API can drive the jukebox and has no login.
      # Reach it through your reverse proxy (see SECURITY.md) if it ever needs to be
      # reachable from outside.
      - "3101:3101"
    # the uid mpv runs as, so its 0600 sockets are ours to open. Also the reason the
    # two directories below need this owner: `mkdir -p data mpv-sockets &&
    # chown 1000:1000 data mpv-sockets`. Running a host user whose uid is not 1000?
    # mirror it here and on Navidrome instead of matching this number.
    user: "1000:1000"
    read_only: true
    volumes:
      - ./data:/data
      - ./mpv-sockets:/mpv-sockets
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Navidrome running in another compose stack? Attach to its network and use
    # the service name in NAVIDROME_URL, e.g. http://navidrome:4533
    # networks: [navidrome]
# networks:
#   navidrome:
#     external: true

<!doctype html>
<html lang="en" data-format="og">
<head>
<meta charset="utf-8" />
<title>juuku — social cards</title>
<style>
@font-face { font-family: 'Instrument Serif'; src: url('../../site/fonts/instrument-serif.woff2') format('woff2'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'Bricolage Grotesque'; src: url('../../site/fonts/bricolage-grotesque.woff2') format('woff2'); font-weight: 300 800; font-style: normal; }
@font-face { font-family: 'Geist Mono'; src: url('../../site/fonts/geist-mono.woff2') format('woff2'); font-weight: 100 900; font-style: normal; }

:root {
  --bg: #14100b;
  --text: #f4ead9;
  --muted: #b6a68c;
  --accent: #f0a24a;
  --line: #3a2f22;
  --serif: 'Instrument Serif', serif;
  --sans: 'Bricolage Grotesque', sans-serif;
  --mono: 'Geist Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; background: var(--bg); }
body {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  color: var(--text);
  font-family: var(--sans);
}

/* the faded library wall, the same layer the page uses */
.cloud {
  position: absolute;
  inset: 0;
  background-image: url('../../site/images/covers.jpg');
  background-size: 96% auto;
  background-position: center top;
  opacity: 0.2;
  filter: saturate(0.75) contrast(0.9);
  mask-image: radial-gradient(80% 70% at 30% 45%, transparent 0%, #000 78%),
    linear-gradient(180deg, #000 0%, #000 55%, transparent 96%);
  mask-composite: intersect;
}
.wash {
  position: absolute;
  inset: 0;
  background: radial-gradient(70% 80% at 22% 30%, rgba(240, 162, 74, 0.16), transparent 70%);
}
.scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(20, 16, 11, 0.92) 0%, rgba(20, 16, 11, 0.72) 48%, rgba(20, 16, 11, 0.35) 100%);
}

.card {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: grid;
  align-items: center;
}

.copy { display: flex; flex-direction: column; }

.mark { display: block; align-self: flex-start; color: var(--text); --logo-kana: var(--muted); --accent: #f0a24a; }

h1 {
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 0.98;
  text-wrap: balance;
}

p.sub { font-family: var(--sans); color: #e6d8c0; }

.foot {
  display: flex;
  align-items: center;
  gap: 0.75em;
  font-family: var(--mono);
  color: var(--muted);
  letter-spacing: 0.02em;
}
.foot .dot { width: 0.42em; height: 0.42em; border-radius: 50%; background: var(--accent); }

/* phones: album in front, library and lyrics behind, no rotation */
.stack { position: relative; aspect-ratio: 780 / 1688; }
/* height drives everything: the stack is as tall as the frame allows, never cropped */
.stack img { height: 100%; width: auto; }
.stack img {
  display: block;
  border: 1px solid var(--line);
  border-radius: 1.1em;
  background: var(--bg);
}
.stack .front { position: relative; z-index: 2; box-shadow: -0.6em 0.8em 2.2em rgba(0,0,0,0.78); }
.stack .back,
.stack .left { position: absolute; top: 50%; height: 90%; z-index: 1; }
.stack .back { right: 0; transform: translate(13%, -50%); }
.stack .left { left: 0; transform: translate(-13%, -50%); }

/* ---------- og / github (wide) ---------- */
html[data-format='og'] body, html[data-format='github'] body { }
/* landscape: screens on the left, copy on the right, the pair centred and the phones
   bleeding off the bottom edge */
html[data-format='og'] .card, html[data-format='github'] .card {
  display: flex;
  flex-direction: row-reverse;
  align-items: center;
  justify-content: center;
  gap: 6rem;
  padding: 3.2rem 3.4rem;
  margin-left: 3rem;
}
/* the copy sits on the right now, so the scrim darkens that side */
html[data-format='og'] .scrim, html[data-format='github'] .scrim {
  background: linear-gradient(270deg, rgba(20, 16, 11, 0.94) 0%, rgba(20, 16, 11, 0.78) 52%, rgba(20, 16, 11, 0.3) 100%);
}
html[data-format='og'] .copy, html[data-format='github'] .copy { max-width: 34rem; align-items: flex-start; text-align: left; }
html[data-format='og'] .mark, html[data-format='github'] .mark { height: 4.2rem; width: auto; margin-bottom: 2.6rem; }
html[data-format='og'] h1, html[data-format='github'] h1 { font-size: 4.3rem; max-width: 16ch; }
html[data-format='og'] p.sub, html[data-format='github'] p.sub { font-size: 1.32rem; line-height: 1.45; margin-top: 1.4rem; max-width: 32ch; }
html[data-format='og'] .foot, html[data-format='github'] .foot { font-size: 0.95rem; margin-top: 1.8rem; }
html[data-format='og'] .stack, html[data-format='github'] .stack { height: calc(100% - 6.4rem); align-self: center; }

/* ---------- square ---------- */
/* square: the landscape composition, with the stack allowed to run off the left */
html[data-format='square'] .card {
  display: flex;
  flex-direction: row-reverse;
  align-items: center;
  justify-content: flex-start;
  gap: 6.5rem;
  padding: 4.5rem;
}
html[data-format='square'] .scrim {
  background: linear-gradient(270deg, rgba(20, 16, 11, 0.94) 0%, rgba(20, 16, 11, 0.78) 55%, rgba(20, 16, 11, 0.32) 100%);
}
html[data-format='square'] .copy { align-items: flex-start; text-align: left; max-width: 33rem; }
html[data-format='square'] .mark { height: 5.4rem; width: auto; margin-bottom: 2.4rem; }
html[data-format='square'] h1 { font-size: 4.3rem; max-width: 16ch; }
html[data-format='square'] p.sub { font-size: 1.32rem; line-height: 1.45; margin-top: 1.4rem; max-width: 32ch; }
html[data-format='square'] .foot { font-size: 1.05rem; margin-top: 1.8rem; }
html[data-format='square'] .stack { height: 70%; align-self: center; margin-left: -8rem; }

/* ---------- story ---------- */
html[data-format='story'] .card {
  grid-template-rows: auto 1fr;
  justify-items: center;
  text-align: center;
  gap: 2.4rem;
  padding: 7rem 5rem 0;
  align-content: start;
}
html[data-format='story'] .scrim { background: linear-gradient(180deg, rgba(20,16,11,0.92) 0%, rgba(20,16,11,0.6) 50%, rgba(20,16,11,0.9) 100%); }
html[data-format='story'] .mark { height: 9rem; width: auto; align-self: center; }
html[data-format='story'] h1 { font-size: 7.4rem; max-width: 12ch; }
html[data-format='story'] p.sub { font-size: 1.95rem; line-height: 1.5; margin-top: 1.8rem; max-width: 19ch; }
html[data-format='story'] .foot { font-size: 1.25rem; margin-top: 2.2rem; justify-content: center; }
html[data-format='story'] .stack { width: 35rem; align-self: end; margin-bottom: -11rem; }
</style>
